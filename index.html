<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Macronaut" />
<meta name="theme-color" content="#0E1013" />
<link rel="manifest" href='data:application/manifest+json,{"name":"Macronaut","short_name":"Macronaut","display":"standalone","background_color":"%230E1013","theme_color":"%230E1013","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2742%27 fill=%27%2323C48A%27/%3E%3Ctext x=%2796%27 y=%27130%27 font-size=%27120%27 font-family=%27Arial%27 font-weight=%27bold%27 fill=%27%2304120c%27 text-anchor=%27middle%27%3EM%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}' />
<title>Macronaut — Macro & Nutrition Tracker</title>
<style>
  :root{
    --bg:#0E1013; --panel:#161A20; --panel-2:#1E232B; --elev:#232A34;
    --border:#2A313C; --border-soft:#20262F; --text:#E8EBF0; --dim:#8A93A2; --faint:#5B6472;
    --accent:#23C48A; --accent-dim:#178C63;
    --cal:var(--accent); --pro:#5B8DEF; --carb:#F5B841; --fat:#F472A0; --water:#38BDF8;
    --danger:#EF6461; --good:#34D399;
    --radius:14px; --radius-sm:9px;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  }
  [data-theme="light"]{
    --bg:#F4F6F8; --panel:#FFFFFF; --panel-2:#F1F3F6; --elev:#FFFFFF;
    --border:#E3E7EC; --border-soft:#ECEFF3; --text:#141A21; --dim:#5C6673; --faint:#98A2B0;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 20px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased; overflow:hidden;
    font-variant-numeric:tabular-nums;
  }
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
  button{font-family:inherit; cursor:pointer}
  input,select,textarea{font-family:inherit}
  ::selection{background:color-mix(in srgb, var(--accent) 35%, transparent)}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }

  /* layout */
  .app{display:grid; grid-template-columns:212px 1fr; height:100vh; height:100dvh}
  .side{
    background:var(--panel); border-right:1px solid var(--border-soft);
    display:flex; flex-direction:column; padding:16px 12px; gap:4px; min-width:0;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 16px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));
    display:grid;place-items:center;color:#04120c;font-weight:800;flex:none}
  .brand b{font-size:15px;letter-spacing:-.02em}
  .brand small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:2px}
  .nav button{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    background:transparent;border:0;color:var(--dim);padding:9px 10px;border-radius:9px;
    font-size:13.5px;font-weight:500;transition:background .12s,color .12s;
  }
  .nav button svg{width:18px;height:18px;flex:none;opacity:.85}
  .nav button:hover{background:var(--panel-2);color:var(--text)}
  .nav button.active{background:var(--panel-2);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--text)}
  .nav button.active svg{opacity:1;color:var(--accent)}
  .nav .kbd{margin-left:auto;font-size:10px;color:var(--faint);font-family:var(--mono)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
  .streakcard{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:11px;padding:11px 12px}
  .streakcard .big{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .streakcard .lbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}

  .main{display:flex;flex-direction:column;min-width:0;height:100vh;height:100dvh}
  .topbar{
    display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--border-soft);
    background:var(--panel);
    background:color-mix(in srgb,var(--panel) 82%,transparent);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);flex:none;
  }
  .topbar h1{font-size:clamp(15px,2.2vw,17px);margin:0;font-weight:700;letter-spacing:-.02em}
  .topbar .sub{color:var(--faint);font-size:12px}
  .spacer{flex:1}
  .datenav{display:flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:3px}
  .datenav button{background:transparent;border:0;color:var(--dim);width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
  .datenav button:hover{background:var(--elev);color:var(--text)}
  .datenav .d{padding:0 12px;font-size:12.5px;font-weight:600;min-width:132px;text-align:center}
  .datenav .d small{display:block;color:var(--faint);font-weight:500;font-size:10.5px}
  .iconbtn{background:var(--panel-2);border:1px solid var(--border-soft);color:var(--dim);width:34px;height:34px;border-radius:9px;display:grid;place-items:center;transition:.12s}
  .iconbtn:hover{color:var(--text);border-color:var(--border)}
  .iconbtn svg{width:17px;height:17px}
  .saved{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--faint);opacity:0;transition:opacity .3s}
  .saved.show{opacity:1}
  .saved .dot{width:6px;height:6px;border-radius:50%;background:var(--good)}

  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px;flex:1}
  .scroll::-webkit-scrollbar{width:10px}
  .scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:3px solid var(--bg)}

  /* cards */
  .card{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);padding:18px;min-width:0}
  .card h3{margin:0 0 2px;font-size:13px;font-weight:600;letter-spacing:.01em}
  .card .csub{color:var(--faint);font-size:11.5px;margin-bottom:14px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
  .g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}

  /* --- tablet: keep sidebar but hide the streak/shortcuts foot --- */
  @media (max-width:900px) and (min-width:701px){
    .app{grid-template-columns:184px 1fr}
    .side-foot{display:none}
  }

  /* --- phone: bottom tab bar --- */
  @media (max-width:700px){
    .app{grid-template-columns:1fr}
    .side{
      position:fixed;left:0;right:0;bottom:0;top:auto;z-index:60;
      flex-direction:row;height:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      border-right:0;border-top:1px solid var(--border);
      background:var(--panel);
    }
    .brand,.side-foot{display:none}
    .nav{flex-direction:row;width:100%;gap:0;margin:0}
    .nav button{
      flex:1;flex-direction:column;gap:3px;justify-content:center;align-items:center;
      padding:7px 0;border-radius:10px;font-size:10px;font-weight:600;color:var(--faint);
    }
    .nav button svg{width:21px;height:21px;opacity:.9}
    .nav .kbd{display:none}
    .nav button.active{background:transparent;color:var(--accent)}
    .nav button.active svg{color:var(--accent);opacity:1}
    .scroll{padding:14px 14px calc(78px + env(safe-area-inset-bottom))}
    .topbar{padding:11px 14px;gap:9px;flex-wrap:wrap}
    .topbar h1{font-size:15px}
    .topbar .sub{display:none}
    .datenav .d{min-width:100px;padding:0 8px;font-size:12px}
    .card{padding:14px}
    .hero{gap:16px}
    .ring-wrap{width:min(64vw,190px);height:min(64vw,190px);margin:0 auto}
    .grid{gap:12px}
    .stat{padding:12px}
    .entry .acts{opacity:1}
    .fitem .fa{opacity:1}
    .meal-h .mk{gap:9px;font-size:11px}
    .modal{padding:18px;max-height:88vh}
    .frow3,.frow4{grid-template-columns:1fr 1fr}
    .field input,.field select,.field textarea,.searchbar input{font-size:16px}
  }
  @media (max-width:430px){
    .entry .mac span{display:none}
    .entry .mac .kc{display:inline}
  }
  @media (max-width:380px){ .frow{grid-template-columns:1fr} }

  /* dashboard hero */
  .hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
  @media (max-width:640px){.hero{grid-template-columns:1fr}}
  .ring-wrap{position:relative;width:190px;height:190px}
  .ring-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring-center .k{font-size:clamp(28px,6vw,34px);font-weight:800;letter-spacing:-.03em;line-height:1}
  .ring-center .of{color:var(--faint);font-size:12px;margin-top:3px}
  .ring-center .rem{color:var(--dim);font-size:11px;margin-top:6px;text-transform:uppercase;letter-spacing:.05em}
  .macbars{display:flex;flex-direction:column;gap:16px}
  .macrow .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .macrow .nm{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .macrow .nm .swatch{width:9px;height:9px;border-radius:3px}
  .macrow .vals{font-size:12px;color:var(--dim)}
  .macrow .vals b{color:var(--text);font-weight:700}
  .track{height:9px;border-radius:6px;background:var(--panel-2);overflow:hidden}
  .track .fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.22,.61,.36,1)}
  .track.over .fill{background-image:repeating-linear-gradient(45deg,transparent,transparent 5px,rgba(0,0,0,.18) 5px,rgba(0,0,0,.18) 10px)}

  /* mini stats */
  .stat{background:var(--panel);border:1px solid var(--border-soft);border-radius:12px;padding:14px 15px}
  .stat .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:6px}
  .stat .v{font-size:clamp(18px,2.4vw,22px);font-weight:800;letter-spacing:-.02em;margin-top:7px}
  .stat .v small{font-size:12px;color:var(--dim);font-weight:600}
  .stat .sub{font-size:11px;color:var(--faint);margin-top:2px}
  .dotc{width:8px;height:8px;border-radius:3px;display:inline-block}

  /* buttons */
  .btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.12s}
  .btn:hover{border-color:var(--faint)}
  .btn svg{width:15px;height:15px}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#04120c}
  .btn.pri:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
  .btn.ghost:hover{background:var(--panel-2);color:var(--text)}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}

  /* diary */
  .meal{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .meal-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border-soft)}
  .meal-h .mname{font-weight:700;font-size:14px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meal-h .mk{font-size:12px;color:var(--faint);margin-left:auto;display:flex;gap:14px;flex:none}
  .meal-h .mk b{color:var(--dim);font-weight:600}
  .mmove{display:flex;gap:2px;margin-left:10px;flex:none}
  .mmove button{background:transparent;border:0;color:var(--faint);width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
  .mmove button:hover:not(:disabled){background:var(--elev);color:var(--text)}
  .mmove button:disabled{opacity:.25;cursor:default}
  .mmove svg{width:16px;height:16px}
  .entry{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border-soft);transition:background .1s}
  .entry:last-child{border-bottom:0}
  .entry:hover{background:var(--panel-2)}
  .entry .en{flex:1;min-width:0}
  .entry .en .t{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .entry .en .s{font-size:11.5px;color:var(--faint)}
  .entry .mac{display:flex;gap:16px;font-size:12px;color:var(--dim);white-space:nowrap}
  .entry .mac .kc{color:var(--text);font-weight:700;min-width:52px;text-align:right}
  .entry .mac span i{font-style:normal;color:var(--faint)}
  .entry .acts{display:flex;gap:3px;opacity:0;transition:.12s}
  .entry:hover .acts{opacity:1}
  .entry .acts button{background:transparent;border:0;color:var(--faint);width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
  .entry .acts button:hover{background:var(--elev);color:var(--text)}
  .meal-add{padding:10px 16px}
  .empty-meal{padding:14px 16px;color:var(--faint);font-size:12.5px}

  /* water */
  .water-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .glass{width:26px;height:34px;border-radius:4px 4px 7px 7px;border:1.5px solid var(--border);position:relative;overflow:hidden;cursor:pointer;background:var(--panel-2);transition:.12s}
  .glass.full{border-color:var(--water)}
  .glass.full:after{content:"";position:absolute;inset:0;top:35%;background:var(--water);opacity:.85}
  .glass:hover{transform:translateY(-2px)}

  /* lists / foods */
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:9px 13px;margin-bottom:14px}
  .searchbar svg{width:16px;height:16px;color:var(--faint);flex:none}
  .searchbar input{background:transparent;border:0;outline:0;color:var(--text);flex:1;font-size:13.5px}
  .searchbar input::placeholder{color:var(--faint)}
  .flist{display:flex;flex-direction:column;gap:0;border:1px solid var(--border-soft);border-radius:12px;overflow:hidden}
  .fitem{display:flex;align-items:center;gap:13px;padding:11px 15px;background:var(--panel);border-bottom:1px solid var(--border-soft);transition:background .1s}
  .fitem:last-child{border-bottom:0}
  .fitem:hover{background:var(--panel-2)}
  .fitem .fav{background:transparent;border:0;color:var(--faint);width:28px;height:28px;border-radius:7px;flex:none}
  .fitem .fav.on{color:var(--carb)}
  .fitem .fav:hover{background:var(--elev)}
  .fitem .fn{flex:1;min-width:0}
  .fitem .fn .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fitem .fn .s{font-size:11.5px;color:var(--faint)}
  .fitem .fm{display:flex;gap:15px;font-size:12px;color:var(--dim);white-space:nowrap}
  .fitem .fm .kc{color:var(--text);font-weight:700}
  .fitem .fa{display:flex;gap:3px}
  .fitem .fa button{background:transparent;border:0;color:var(--faint);width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
  .fitem .fa button:hover{background:var(--elev);color:var(--text)}
  .chip{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--border-soft);color:var(--dim)}
  .tag-mac{font-family:var(--mono);font-size:11px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(4,6,9,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:20px}
  [data-theme="light"] .overlay{background:rgba(20,26,33,.35)}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:22px}
  .modal h2{margin:0 0 3px;font-size:17px;letter-spacing:-.02em}
  .modal .msub{color:var(--faint);font-size:12px;margin-bottom:18px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:9px 11px;font-size:13.5px;outline:none;transition:border .12s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .frow3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .frow4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .modal-foot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px}
  .modal-foot .spacer{flex:1}
  .scanbox{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden;margin-bottom:12px}
  .scanbox video{width:100%;height:100%;object-fit:cover;display:block}
  .scan-reticle{position:absolute;inset:18% 12%;border:2px solid var(--accent);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.28);pointer-events:none}
  .scan-status{font-size:12.5px;color:var(--dim);text-align:center;margin-bottom:4px;min-height:18px}

  /* progress / charts */
  svg text{fill:var(--faint);font-size:10px;font-family:var(--sans)}
  .xlabels{display:flex;margin-top:6px;font-size:10.5px;color:var(--faint);gap:2px}
  .xlabels span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xlabels[style*="space-between"] span{flex:none}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:10px}
  .legend span{display:flex;align-items:center;gap:6px}
  .adh{display:flex;flex-direction:column;gap:11px}
  .adh .arow{display:flex;align-items:center;gap:12px}
  .adh .arow .an{width:74px;font-size:12px;color:var(--dim)}
  .adh .arow .ab{flex:1}
  .adh .arow .av{width:52px;text-align:right;font-size:12.5px;font-weight:700}

  /* heatmap */
  .heat{display:flex;gap:3px;flex-wrap:wrap}
  .heat .cell{width:15px;height:15px;border-radius:3px;background:var(--panel-2)}

  .kbd-list{display:grid;grid-template-columns:1fr 1fr;gap:9px 22px}
  .kbd-list .row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
  .kbd-list .row span{color:var(--dim)}
  kbd{font-family:var(--mono);font-size:11px;background:var(--panel-2);border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:2px 7px;color:var(--text)}

  .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--elev);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:120;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
  .toast.show{pointer-events:auto}
  .toast-undo{background:transparent;border:0;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:2px 4px;flex:none}
  @media (max-width:700px){ .toast{bottom:calc(82px + env(safe-area-inset-bottom))} }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;padding:50px 20px;color:var(--faint)}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:12px}
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .nudge{display:flex;align-items:center;gap:9px;background:color-mix(in srgb,var(--carb) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--carb) 35%,var(--border-soft));border-radius:11px;padding:11px 14px;margin-bottom:16px;font-size:12.5px;color:var(--text);cursor:pointer}
  .nudge:hover{border-color:var(--carb)}
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:3px}
  .seg button{background:transparent;border:0;color:var(--dim);padding:5px 12px;border-radius:6px;font-size:12.5px;font-weight:600}
  .seg button.on{background:var(--elev);color:var(--text)}
  a{color:var(--accent)}

    try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
    return _mem[k]??null;
  },
  async set(k,v){
    _mem[k]=v;

/* ---------------- goal calculator ---------------- */
const ACTIVITY={sedentary:1.2,light:1.375,moderate:1.55,very:1.725,athlete:1.9};
const ACTIVITY_LABEL={sedentary:"Sedentary (little exercise)",light:"Lightly active (1-3 days/wk)",moderate:"Moderately active (3-5 days/wk)",very:"Very active (6-7 days/wk)",athlete:"Athlete (hard daily training)"};
const GOAL_ADJ={maintain:0,mildloss:-250,loss:-500,extremeloss:-1000,leangain:300,gain:500};
const GOAL_LABEL={maintain:"Maintain weight",mildloss:"Mild fat loss (~0.25 kg/wk)",loss:"Fat loss (~0.5 kg/wk)",extremeloss:"Extreme fat loss (~1 kg/wk)",leangain:"Lean muscle gain",gain:"Gain weight"};
function computeTargets(p,weightKg){
  if(!p.age||!p.heightCm||!weightKg) return null;
  const bmr=10*weightKg + 6.25*p.heightCm - 5*p.age + (p.sex==="female"?-161:5);
  const tdee=bmr*(ACTIVITY[p.activity]||1.55);
  let cal=tdee+(GOAL_ADJ[p.goal]||0);
  const floor=p.sex==="female"?1200:1500;
  let floored=false;
  if(cal<floor){ cal=floor; floored=true; }
  cal=Math.round(cal/10)*10;
  const weightLb=weightKg*KG2LB;
  // protein ~1 g/lb, capped at 45% of calories
  let protein=Math.round(weightLb);
  if(protein*4 > cal*0.45) protein=Math.round(cal*0.45/4);
  let fat=Math.round(cal*0.25/9);
  let carbs=Math.round((cal-protein*4-fat*9)/4);
  if(carbs<0){ carbs=0; fat=Math.round((cal-protein*4)/9); if(fat<0)fat=0; }
  const fiber=Math.round(cal/1000*14);
  const water=Math.round(weightKg*35/250)*250;
  return {kcal:cal,p:protein,c:carbs,f:fat,fib:fiber,water,bmr:Math.round(bmr),tdee:Math.round(tdee),floored};
}

function ensureDay(iso){
  if(!S.days[iso]) S.days[iso]={meals:{},order:[...S.settings.mealDefaults],water:0,note:""};

  d.order.forEach(m=>{ if(!d.meals[m]) d.meals[m]=[]; });

  if(typeof d.steps!=="number") d.steps=0;

function currentWeightKg(){ const lw=lastWeight(); if(lw)return lw.kg; return 70; }

function entryTotals(e,mult){ mult=mult==null?e.mult:mult; return {kcal:e.kcal*mult,p:e.p*mult,c:e.c*mult,f:e.f*mult,fib:(e.fib||0)*mult,sug:(e.sug||0)*mult,sod:(e.sod||0)*mult}; }
function mealTotals(arr){ const t={kcal:0,p:0,c:0,f:0,fib:0,sug:0,sod:0}; arr.forEach(e=>{const x=entryTotals(e);for(const k in t)t[k]+=x[k];}); return t; }
function dayTotals(iso){ const d=S.days[iso]; const t={kcal:0,p:0,c:0,f:0,fib:0,sug:0,sod:0}; if(!d)return t;
  d.order.forEach(m=>{ (d.meals[m]||[]).forEach(e=>{const x=entryTotals(e);for(const k in t)t[k]+=x[k];}); }); return t; }
function dayHasLog(iso){ const d=S.days[iso]; if(!d)return false; return d.order.some(m=>(d.meals[m]||[]).length>0); }

function computeStreak(){
  let start=todayISO(); if(!dayHasLog(start)) start=addDays(start,-1);
  let n=0, cur=start;
  while(dayHasLog(cur)){ n++; cur=addDays(cur,-1); if(n>3650)break; }
  return n;
}

  let sum=0,cnt=0;
  for(let i=0;i<7;i++){ const iso=addDays(todayISO(),-i); if(dayHasLog(iso)){ sum+=dayTotals(iso).kcal; cnt++; } }
  return cnt?Math.round(sum/cnt):0;

}
function obWelcome(){

function obSetup(){

    <p class="ob-sub" style="margin-bottom:18px">This sets your daily calorie and macro targets. You can change any of it later.</p>
    <div class="field"><label>Sex</label>

      <select id="ob_activity">${Object.keys(ACTIVITY).map(k=>`<option value="${k}" ${p.activity===k?"selected":""}>${ACTIVITY_LABEL[k]}</option>`).join("")}</select>

function obPreviewHTML(calc){
  if(!calc) return `<div style="color:var(--faint);font-size:12.5px;text-align:center">Fill in age, weight and height to see your targets.</div>`;
  return `<div style="display:flex;align-items:baseline;gap:8px;justify-content:center;margin-bottom:8px"><b class="num" style="font-size:26px">${calc.kcal}</b><span style="color:var(--dim);font-size:12.5px">kcal / day</span></div>
    <div style="display:flex;gap:14px;justify-content:center;font-size:12.5px;flex-wrap:wrap">
      <span style="color:var(--pro)">Protein <b class="num">${calc.p}g</b></span>
      <span style="color:var(--carb)">Carbs <b class="num">${calc.c}g</b></span>
      <span style="color:var(--fat)">Fat <b class="num">${calc.f}g</b></span>
    </div>`;
}
function wireOnboard(){
  const isLb=S.settings.units==="lb";
  const read=()=>{
    const p={...S.profile};
    p.age=+($("#ob_age")?.value)||"";
    p.activity=$("#ob_activity")?.value||p.activity;
    p.goal=$("#ob_goal")?.value||p.goal;
    if(isLb){ const ft=+($("#ob_ft")?.value)||0, inch=+($("#ob_in")?.value)||0; p.heightCm=(ft||inch)?(ft*12+inch)*2.54:""; }
    else { const c=+($("#ob_cm")?.value)||0; p.heightCm=c||""; }
    S.profile=p;
    let wkg=0; const wv=+($("#ob_weight")?.value)||0; if(wv) wkg=wToKg(wv);
    return {p,wkg,wv};
  };
  const refresh=()=>{ const {p,wkg}=read(); const el=$("#obPreview"); if(el) el.innerHTML=obPreviewHTML(computeTargets(p,wkg)); };
  ["ob_age","ob_ft","ob_in","ob_cm","ob_weight","ob_activity","ob_goal"].forEach(id=>{ const e=$("#"+id); if(e){ e.addEventListener("input",refresh); e.addEventListener("change",refresh); } });
}
function finishOnboarding(apply){
  if(apply){
    const isLb=S.settings.units==="lb";
    let heightCm; if(isLb){ const ft=+($("#ob_ft")?.value)||0, inch=+($("#ob_in")?.value)||0; heightCm=(ft*12+inch)*2.54; } else heightCm=+($("#ob_cm")?.value)||0;
    const age=+($("#ob_age")?.value)||0; const wv=+($("#ob_weight")?.value)||0; const wkg=wv?wToKg(wv):0;
    S.profile={sex:S.profile.sex,age,heightCm,activity:$("#ob_activity")?.value||"moderate",goal:$("#ob_goal")?.value||"maintain"};
    const calc=computeTargets(S.profile,wkg);
    if(calc){ S.goals.kcal=calc.kcal; S.goals.p=calc.p; S.goals.c=calc.c; S.goals.f=calc.f; S.goals.fib=calc.fib; S.goals.water=calc.water; }
    if(wv){ const today=todayISO(); if(!S.weights.some(w=>w.date===today)) S.weights.push({id:uid(),date:today,kg:wkg,bf:null,note:"from setup"}); }
  }
  S.meta.onboarded=true; save(); renderShell();
  toast(apply?"You're all set — targets ready":"Set up anytime in the Profile tab");
}

/* ---------------- view router ---------------- */
function renderView(keepScroll){
  const v=$("#view"); if(!v) return;
  const top = keepScroll ? v.scrollTop : 0;
  if(ui.view==="dashboard") v.innerHTML=viewDashboard();
  else if(ui.view==="diary") v.innerHTML=viewDiary();
  else if(ui.view==="food"){ v.innerHTML=viewFood(); wireFoodSearch(); }
  else if(ui.view==="progress") v.innerHTML=viewProgress();
  else if(ui.view==="profile"){ v.innerHTML=viewProfile(); wireProfile(); }
  else if(ui.view==="settings"){ v.innerHTML=viewSettings(); wireSettings(); }
  if(keepScroll) v.scrollTop=top;
}
function updateStreak(){ const el=$("#streakBig"); if(el) el.innerHTML=computeStreak()+`<span style="font-size:13px;color:var(--faint);font-weight:600"> days</span>`; }

/* ---------------- ring + bar builders ---------------- */
function ring(pct,color,size=190,stroke=15){
  const rad=(size-stroke)/2, c=2*Math.PI*rad;
  const p=clamp(pct,0,1), dash=c*p;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${rad}" fill="none" stroke="var(--panel-2)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${rad}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${dash} ${c}" style="transition:stroke-dasharray .6s cubic-bezier(.22,.61,.36,1)"/>
  </svg>`;
}
function macBar(name,cur,goal,color){
  const pct=goal>0?cur/goal:0; const over=cur>goal&&goal>0;
  return `<div class="macrow">
    <div class="top">
      <div class="nm"><span class="swatch" style="background:${color}"></span>${name}</div>
      <div class="vals"><b class="num">${r0(cur)}</b> / ${r0(goal)} g</div>
    </div>
    <div class="track ${over?"over":""}"><div class="fill" style="width:${clamp(pct,0,1)*100}%;background:${color}"></div></div>
  </div>`;
}

/* ---------------- DASHBOARD ---------------- */
function viewDashboard(){
  const iso=ui.date, t=dayTotals(iso), g=S.goals, d=S.days[iso];
  const rem=g.kcal-t.kcal;
  const calPct=g.kcal>0?t.kcal/g.kcal:0;
  const mealsLogged=d?d.order.filter(m=>(d.meals[m]||[]).length>0).length:0;
  const mealsTotal=d?d.order.length:S.settings.mealDefaults.length;
  const lw=lastWeight();
  const water=d?d.water:0;
  const favs=S.foods.filter(f=>f.fav).slice(0,6);

  const mini=(lbl,val,sub,color)=>`<div class="stat"><div class="lbl">${color?`<span class="dotc" style="background:${color}"></span>`:""}${lbl}</div><div class="v num">${val}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;

  return `
  ${backupNudge()}
  <div class="grid" style="margin-bottom:16px">
    <div class="card">
      <div class="hero">
        <div class="ring-wrap">
          ${ring(calPct,"var(--accent)")}

            <div class="k num">${r0(t.kcal)}</div>
            <div class="of">of ${r0(g.kcal)} kcal</div>
            <div class="rem" style="color:${rem<0?'var(--danger)':'var(--dim)'}">${rem>=0?r0(rem)+" left":r0(-rem)+" over"}</div>
          </div>
        </div>
        <div class="macbars">
          ${macBar("Protein",t.p,g.p,"var(--pro)")}
          ${macBar("Carbs",t.c,g.c,"var(--carb)")}
          ${macBar("Fat",t.f,g.f,"var(--fat)")}
          <div style="display:flex;gap:9px;margin-top:2px">
            <button class="btn pri sm" data-act="quickfab">${I.plus}Quick add</button>
            <button class="btn sm" data-act="view" data-v="diary">Open diary</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="grid g4" style="margin-bottom:16px">
    ${mini("Fiber",r0(t.fib)+" <small>/ "+r0(g.fib)+" g</small>","",null)}
    ${mini("Sugar",r0(t.sug)+" <small>/ "+r0(g.sug)+" g</small>","",null)}
    ${mini("Sodium",r0(t.sod)+" <small>/ "+r0(g.sod)+" mg</small>","",null)}
    ${mini("Water","<span style='color:var(--water)'>"+r0(water)+"</span> <small>/ "+r0(g.water)+" ml</small>","Log in diary","var(--water)")}
  </div>

  <div class="grid g4" style="margin-bottom:16px">
    ${mini("Steps","<span style='color:var(--accent)'>"+r0(d?d.steps||0:0)+"</span> <small>/ "+r0(g.steps)+"</small>","Log in diary","var(--accent)")}
    ${mini("Burned","<span style='color:var(--good)'>"+r0(exerciseBurn(iso))+"</span> <small>kcal</small>","exercise + steps","var(--good)")}
    ${mini("Net calories",r0(t.kcal-exerciseBurn(iso))+" <small>kcal</small>","eaten − burned",null)}
    ${mini("Meals logged",mealsLogged+" <small>/ "+mealsTotal+"</small>","",null)}
  </div>

  <div class="grid g4" style="margin-bottom:16px">
    ${mini("7-day avg",weeklyAvg()+" <small>kcal</small>","logged days",null)}
    ${mini("Weight",lw?wDisp(lw.kg)+" <small>"+wUnit()+"</small>":"—",lw?relDate(lw.date):"none yet",null)}
    ${mini("Streak",computeStreak()+" <small>days</small>","keep it going","var(--accent)")}
  </div>

  <div class="grid g2">

      <h3>Last 7 days</h3><div class="csub">Calories vs goal</div>

      ${favs.length? `<div style="display:flex;flex-direction:column;gap:7px">

          <button class="btn sm pri" data-act="quickfav" data-id="${f.id}">${I.plus}Add</button>
        </div>`).join("")}
      </div>`
      : `<div class="empty" style="padding:24px">Star foods in the database to pin them here.</div>`}
    </div>
  </div>`;
}
function miniBars(days){
  const arr=[]; let max=S.goals.kcal;
  for(let i=days-1;i>=0;i--){ const iso=addDays(todayISO(),-i); const k=dayTotals(iso).kcal; arr.push({iso,k}); if(k>max)max=k; }
  max=max*1.1||1;
  const goalY=110-(S.goals.kcal/max)*96;
  const bars=arr.map((a,i)=>{ const h=(a.k/max)*96; const x=i*(320/days)+ (320/days-18)/2; const over=a.k>S.goals.kcal;
    return `<rect x="${x}" y="${110-h}" width="18" height="${Math.max(h,a.k?2:0)}" rx="3" fill="${a.k?(over?'var(--danger)':'var(--accent)'):'var(--panel-2)'}"><title>${relDate(a.iso)}: ${r0(a.k)} kcal</title></rect>`;
  }).join("");
  const labels=arr.map(a=>`<span>${weekdayShort(a.iso)}</span>`).join("");
  return `<svg viewBox="0 0 320 110" width="100%" height="110" preserveAspectRatio="none" style="margin-top:6px;display:block">
    <line x1="0" y1="${goalY}" x2="320" y2="${goalY}" stroke="var(--border)" stroke-dasharray="4 4"/>
    ${bars}
  </svg>
  <div class="xlabels">${labels}</div>`;
}
function weekdayShort(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"short"}); }
function monthDay(iso){ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

        </div>
      </div>
      ${arr.length? arr.map(e=>{ const x=entryTotals(e); return `

      ${d.water>0?`<button class="btn sm ghost" data-act="waterReset">Reset</button>`:""}
    </div>

  // exercise & steps
  const stepKcal=kcalFromSteps(d.steps||0);

  html+=`<div class="card" style="margin-top:6px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">

}

/* ---------------- FOODS & RECIPES ---------------- */
function recipeTotals(rc){
  const t={kcal:0,p:0,c:0,f:0,fib:0,sug:0,sod:0};
  (rc.items||[]).forEach(it=>{ const m=it.mult||1; t.kcal+=it.kcal*m;t.p+=it.p*m;t.c+=it.c*m;t.f+=it.f*m;t.fib+=(it.fib||0)*m;t.sug+=(it.sug||0)*m;t.sod+=(it.sod||0)*m; });
  return t;
}
function recipePerServing(rc){ const t=recipeTotals(rc); const s=rc.servings||1; const o={}; for(const k in t)o[k]=t[k]/s; return o; }
function recipeAsFood(rc){ const ps=recipePerServing(rc); return {name:rc.name,serving:1,unit:"serving",kcal:ps.kcal,p:ps.p,c:ps.c,f:ps.f,fib:ps.fib,sug:ps.sug,sod:ps.sod,recipeId:rc.id}; }

}

/* ---------------- PROGRESS ---------------- */
function viewProgress(){
  const R=ui.progressRange;
  const days=[]; for(let i=R-1;i>=0;i--){ const iso=addDays(todayISO(),-i); const t=dayTotals(iso); days.push({iso,...t,log:dayHasLog(iso)}); }
  const logged=days.filter(d=>d.log);
  const avg=k=>logged.length?Math.round(logged.reduce((s,d)=>s+d[k],0)/logged.length):0;
  // adherence: % of logged days within ±10% of calorie goal, protein >= 90% goal
  const calHit=logged.filter(d=>Math.abs(d.kcal-S.goals.kcal)<=S.goals.kcal*0.1).length;
  const proHit=logged.filter(d=>d.p>=S.goals.p*0.9).length;
  const adhCal=logged.length?Math.round(calHit/logged.length*100):0;
  const adhPro=logged.length?Math.round(proHit/logged.length*100):0;

  // most used foods
  const freq={};
  Object.keys(S.days).forEach(iso=>{ const d=S.days[iso]; d.order.forEach(m=>(d.meals[m]||[]).forEach(e=>{ freq[e.name]=(freq[e.name]||0)+1; })); });
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6);

  return `
  <div class="pill-row"><div class="seg">
    ${[7,14,30,90].map(n=>`<button class="${R===n?'on':''}" data-act="range" data-n="${n}">${n}d</button>`).join("")}
  </div></div>

  <div class="grid g4" style="margin-bottom:16px">
    <div class="stat"><div class="lbl">Avg calories</div><div class="v num">${avg("kcal")}</div><div class="sub">${logged.length} logged days</div></div>
    <div class="stat"><div class="lbl">Avg protein</div><div class="v num">${avg("p")} <small>g</small></div><div class="sub">goal ${S.goals.p} g</div></div>
    <div class="stat"><div class="lbl">Avg carbs</div><div class="v num">${avg("c")} <small>g</small></div></div>
    <div class="stat"><div class="lbl">Avg fat</div><div class="v num">${avg("f")} <small>g</small></div></div>
  </div>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>Calories</h3><div class="csub">Daily intake vs goal · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:d.kcal})),S.goals.kcal,"var(--accent)")}</div>
    <div class="card"><h3>Protein</h3><div class="csub">Daily grams vs goal · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:d.p})),S.goals.p,"var(--pro)")}</div>
  </div>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>Carbs</h3><div class="csub">Daily grams vs goal · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:d.c})),S.goals.c,"var(--carb)")}</div>
    <div class="card"><h3>Fat</h3><div class="csub">Daily grams vs goal · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:d.f})),S.goals.f,"var(--fat)")}</div>
  </div>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>Fiber</h3><div class="csub">Daily grams vs goal · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:d.fib})),S.goals.fib,"var(--good)")}</div>
    <div class="card"><h3>Sodium</h3><div class="csub">Daily mg vs limit · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:d.sod})),S.goals.sod,"var(--water)")}</div>
  </div>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>Steps</h3><div class="csub">Daily steps vs goal · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:(S.days[d.iso]&&S.days[d.iso].steps)||0})),S.goals.steps,"var(--accent)")}</div>
    <div class="card"><h3>Calories burned</h3><div class="csub">Exercise + steps · last ${R} days</div>${barChart(days.map(d=>({iso:d.iso,v:exerciseBurn(d.iso)})),0,"var(--good)")}</div>
  </div>

  <div class="grid g2">
    <div class="card"><h3>Goal adherence</h3><div class="csub">Across ${logged.length} logged days</div>
      <div class="adh">
        <div class="arow"><div class="an">Calories</div><div class="ab"><div class="track"><div class="fill" style="width:${adhCal}%;background:var(--accent)"></div></div></div><div class="av num">${adhCal}%</div></div>
        <div class="arow"><div class="an">Protein</div><div class="ab"><div class="track"><div class="fill" style="width:${adhPro}%;background:var(--pro)"></div></div></div><div class="av num">${adhPro}%</div></div>
      </div>
      <div style="margin-top:16px;font-size:11px;color:var(--faint)">Calories counts days within ±10% of your goal. Protein counts days ≥90% of goal.</div>

      ${top.length? `<div style="display:flex;flex-direction:column;gap:9px;margin-top:4px">
        ${top.map(([n,c])=>`<div style="display:flex;align-items:center;gap:12px">
          <div style="flex:1;font-size:13px">${esc(n)}</div>
          <div style="width:120px"><div class="track"><div class="fill" style="width:${c/top[0][1]*100}%;background:var(--carb)"></div></div></div>
          <div class="num" style="width:24px;text-align:right;font-size:12px;font-weight:700">${c}</div>
        </div>`).join("")}
      </div>`:`<div class="empty" style="padding:20px">Log some foods to see your top items.</div>`}
    </div>
  </div>`;
}
function barChart(data,goal,color){
  const n=data.length; let max=goal||1; data.forEach(d=>{if(d.v>max)max=d.v;}); max*=1.12;
  const H=150,W=520;
  const bw=W/n;
  const gy=H-(goal/max)*H;
  const bars=data.map((d,i)=>{ const h=Math.max((d.v/max)*H,d.v>0?2:0); const x=i*bw+bw*0.16; const over=goal&&d.v>goal;
      return `<rect x="${x}" y="${H-h}" width="${bw*0.68}" height="${h}" rx="2.5" fill="${d.v?(over?'var(--danger)':color):'var(--panel-2)'}" opacity="${d.v?1:.6}"><title>${relDate(d.iso)}: ${r0(d.v)}</title></rect>`;
    }).join("");
  // sparse HTML labels aligned under bars
  const every = n<=7?1 : n<=14?2 : n<=31?5 : 15;
  const labels=data.map((d,i)=>{ const show = i%every===0 || i===n-1; return `<span>${show?monthDay(d.iso):""}</span>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:6px;display:block" preserveAspectRatio="none">
    ${goal?`<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="var(--dim)" stroke-dasharray="4 4" opacity=".5"/>`:""}
    ${bars}
  </svg>
  <div class="xlabels">${labels}</div>`;
}

function targetRow(name,val,kcalFrom,total,color){

function wireProfile(){
  const isLb=S.settings.units==="lb";
  const refresh=()=>{
    const p={...S.profile};
    p.age=+($("#pf_age")?.value)||"";

    else { const c=+($("#pf_cm")?.value)||0; p.heightCm=c||""; }
    S.profile=p; save();
    let wkg=0; const wv=+($("#pf_weight")?.value)||0; if(wv) wkg=wToKg(wv);

}

function lineChart(data,color){
  const n=data.length; const H=180,W=520;
  let min=Infinity,max=-Infinity; data.forEach(d=>{min=Math.min(min,d.v);max=Math.max(max,d.v);});
  if(min===max){min-=1;max+=1;} const rng=max-min; min-=rng*0.12; max+=rng*0.12;
  const X=i=> n===1? W/2 : (i/(n-1))*W;
  const Y=v=> H-6-((v-min)/(max-min))*(H-12);
  const pts=data.map((d,i)=>`${X(i)},${Y(d.v)}`).join(" ");
  const area=`0,${H} ${pts} ${W},${H}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:6px;display:block" preserveAspectRatio="none">
    <polygon points="${area}" fill="${color}" opacity=".08"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="xlabels" style="justify-content:space-between"><span>${monthDay(data[0].iso)}</span><span>${monthDay(data[n-1].iso)}</span></div>`;
}

const SCAN_SUPPORTED = (typeof window!=="undefined") && ("BarcodeDetector" in window) && !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
let scanStream=null, scanLoop=null, scanBusy=false;
function openScanner(meal){
  ui.modal={type:"scanner",meal:meal||null};
  openModal(`
    <h2>Scan barcode</h2><div class="msub">Point the rear camera at a product barcode</div>
    <div class="scanbox">

    </div>

    <div class="modal-foot"><button class="btn ghost" data-act="overlayClose">Cancel</button><div class="spacer"></div><button class="btn" data-act="scanManual">${I.plus}Enter manually</button></div>
  `);
  startScan();
}
async function startScan(){
  const status=m=>{ const el=$("#scanStatus"); if(el) el.innerHTML=m; };
  const insecure = (typeof window!=="undefined") && window.isSecureContext===false;
  if(insecure){ status("Your camera is blocked because this page isn't secure.<br>Open the app from your <b>https</b> link (GitHub Pages) instead of the downloaded file — then the camera prompt will appear. Meanwhile you can tap <b>Enter manually</b>."); return; }
  if(!("BarcodeDetector" in window)){ status("This browser can't scan barcodes (for example iPhone/Safari). Open the app in <b>Chrome on Android</b>, or tap <b>Enter manually</b>."); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ status("Camera access isn't available here. Open the app over <b>https</b>, or tap <b>Enter manually</b>."); return; }
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    const v=$("#scanVideo"); if(!v){ stopScan(); return; }
    v.srcObject=scanStream; await v.play();
    status("Line up the barcode…");
    const detector=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code","itf"]});
    scanBusy=false;
    scanLoop=setInterval(async()=>{
      if(scanBusy||!$("#scanVideo"))return; scanBusy=true;
      try{
        const codes=await detector.detect(v);
        if(codes&&codes.length){ const code=codes[0].rawValue; stopScan(); handleScannedCode(code, ui.modal&&ui.modal.meal); return; }
      }catch(e){}
      scanBusy=false;
    },350);
  }catch(err){
    status(err&&err.name==="NotAllowedError" ? "Camera permission was denied. Tap the address-bar lock icon → Permissions → allow Camera, then try again. Or tap <b>Enter manually</b>." : "Couldn't start the camera. Tap <b>Enter manually</b>.");
  }
}
function stopScan(){
  if(scanLoop){ clearInterval(scanLoop); scanLoop=null; }
  if(scanStream){ try{ scanStream.getTracks().forEach(t=>t.stop()); }catch(e){} scanStream=null; }
  scanBusy=false;
}
async function lookupOFF(code){
  try{
    if(typeof navigator!=="undefined" && navigator.onLine===false) return null;
    const res=await fetch("https://world.openfoodfacts.org/api/v0/product/"+encodeURIComponent(code)+".json");
    const j=await res.json();
    if(j.status!==1||!j.product) return null;
    const p=j.product, n=p.nutriments||{};
    const num=v=>{ const x=parseFloat(v); return isFinite(x)?x:0; };
    let kcal=num(n["energy-kcal_100g"]); if(!kcal&&n.energy_100g) kcal=num(n.energy_100g)/4.184;
    let sod = n.sodium_100g!=null? num(n.sodium_100g)*1000 : (n.salt_100g!=null? num(n.salt_100g)*400 : 0);
    const name=[(p.brands||"").split(",")[0].trim(),(p.product_name||p.generic_name||"").trim()].filter(Boolean).join(" ").slice(0,60)||"Scanned item";
    return { name, serving:100, unit:"g", kcal:Math.round(kcal), p:num(n.proteins_100g), c:num(n.carbohydrates_100g),
      f:num(n.fat_100g), fib:num(n.fiber_100g), sug:num(n.sugars_100g), sod:Math.round(sod),
      cat:(p.categories||"").split(",").pop().trim(), barcode:code };
  }catch(e){ return null; }
}
async function handleScannedCode(code, meal){
  // 1) match your own foods (offline, instant)
  const existing=S.foods.find(x=>x.barcode&&String(x.barcode)===String(code));
  if(existing){ closeModal(); toast("Found: "+existing.name); servingModal(existing, meal||ensureDay(ui.date).order[0]||"Snacks"); return; }
  // 2) online lookup (optional)
  const st=$("#scanStatus"); if(st) st.textContent="Looking up "+code+"…";
  const online = (typeof navigator==="undefined") || navigator.onLine!==false;
  const off = online ? await lookupOFF(code) : null;
  closeModal();
  if(off){ foodFormModal(off, {addTo:meal, barcode:code, fromScan:true, found:true}); }
  else { foodFormModal({name:"",serving:100,unit:"g",kcal:"",p:"",c:"",f:"",fib:"",sug:"",sod:"",cat:"",barcode:code},
                       {addTo:meal, barcode:code, fromScan:true, found:false}); }
}

function exListHTML(q){
  q=q.trim().toLowerCase();
  let list=EXERCISES.slice();
  if(q) list=list.filter(e=>(e.name+" "+e.cat).toLowerCase().includes(q));
  if(!list.length) return `<div class="empty" style="padding:24px">No match — tap "Custom activity" to add your own.</div>`;
  const cats=[...new Set(list.map(e=>e.cat))];
  return cats.map(cat=>`<div style="font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:12px 2px 6px">${cat}</div>
    <div class="flist">${list.filter(e=>e.cat===cat).map((e,i)=>`<div class="fitem" style="cursor:pointer" data-act="pickExercise" data-name="${esc(e.name)}" data-met="${e.met}">
      <div class="fn"><div class="t">${esc(e.name)}</div><div class="s">${e.met} MET · burns ~${r0(workoutKcal(e.met,30))} kcal / 30 min</div></div>
    </div>`).join("")}</div>`).join("");
}

/* ---------------- toast ---------------- */
let toastT=null;
function toast(msg){ const el=$("#toast"); if(!el)return; el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1900); }
function toastUndo(msg){ const el=$("#toast"); if(!el)return; el.innerHTML=`<span>${esc(msg)}</span><button class="toast-undo" data-act="undoDel">Undo</button>`; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>{ el.classList.remove("show"); undoBuf=null; },5000); }
function hideToast(){ const el=$("#toast"); if(el) el.classList.remove("show"); clearTimeout(toastT); }

/* ---------------- actions ---------------- */
function addEntryToMeal(mealName,food,mult){
  const d=ensureDay(ui.date);
  if(!d.meals[mealName]) { d.meals[mealName]=[]; if(!d.order.includes(mealName)) d.order.push(mealName); }
  d.meals[mealName].push({id:uid(),name:food.name,serving:food.serving,unit:food.unit,mult,
    kcal:food.kcal,p:food.p,c:food.c,f:food.f,fib:food.fib||0,sug:food.sug||0,sod:food.sod||0});
  save();
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act]"); if(!t)return;
  const a=t.dataset.act;

  switch(a){
    case "overlayClose": closeModal(); break;
    case "obNext": ui.obStep=1; renderOnboarding(); break;
    case "obBack": ui.obStep=0; renderOnboarding(); break;
    case "ob_sex": S.profile.sex=t.dataset.v; renderOnboarding(); break;
    case "obSkip": finishOnboarding(false); break;
    case "obFinish": finishOnboarding(true); break;
    case "view": ui.view=t.dataset.v; renderShell(); break;
    case "date": ui.date=addDays(ui.date,+t.dataset.n); renderTop(); renderView(true); break;
    case "today": ui.date=todayISO(); renderTop(); renderView(true); break;
    case "theme": S.settings.theme=S.settings.theme==="dark"?"light":"dark"; applyTheme(); save(); renderTop(); break;
    case "fullscreen": {
      const doc=document, el=doc.documentElement;
      const isFs=doc.fullscreenElement||doc.webkitFullscreenElement;
      try{
        if(!isFs){ (el.requestFullscreen||el.webkitRequestFullscreen).call(el); }
        else { (doc.exitFullscreen||doc.webkitExitFullscreen).call(doc); }
      }catch(err){ toast("Full screen isn't available here"); }
      setTimeout(renderTop,120);
      break;
    }
    case "pf_sex": S.profile.sex=t.dataset.v; save(); renderView(); break;
    case "applyProfile": {
      const isLb=S.settings.units==="lb";
      let heightCm;
      if(isLb){ const ft=+($("#pf_ft")?.value)||0, inch=+($("#pf_in")?.value)||0; heightCm=(ft*12+inch)*2.54; }
      else heightCm=+($("#pf_cm")?.value)||0;
      const age=+($("#pf_age")?.value)||0;
      const wv=+($("#pf_weight")?.value)||0;
      const wkg=wv?wToKg(wv):(lastWeight()?lastWeight().kg:0);
      S.profile={sex:S.profile.sex,age,heightCm,activity:$("#pf_activity").value,goal:$("#pf_goal").value};
      const calc=computeTargets(S.profile,wkg);
      if(!calc){ toast("Enter age, height, and weight first"); break; }
      S.goals.kcal=calc.kcal; S.goals.p=calc.p; S.goals.c=calc.c; S.goals.f=calc.f; S.goals.fib=calc.fib; S.goals.water=calc.water;
      if(wv){ const today=todayISO(); if(!S.weights.some(w=>w.date===today)) S.weights.push({id:uid(),date:today,kg:wkg,bf:null,note:"from profile"}); }
      save(); toast("Targets applied to your goals"); renderView(true); break;
    }
    case "shortcuts": shortcutsModal(); break;

    /* quick add */
    case "quickfab": quickAddModal(); break;
    case "quickfav": { const f=S.foods.find(x=>x.id===t.dataset.id); if(f){ addEntryToMeal("Snacks",f,1); toast(f.name+" → Snacks"); renderView(true); updateStreak(); } break; }
    case "confirmQuick": {
      let kcal=+$("#qa_kcal").value; const p=+$("#qa_p").value||0,c=+$("#qa_c").value||0,f=+$("#qa_f").value||0;
      if(!kcal) kcal=p*4+c*4+f*9;
      const name=$("#qa_name").value.trim()||"Quick add"; const meal=$("#qa_meal").value;
      addEntryToMeal(meal,{name,serving:1,unit:"serving",kcal,p,c,f,fib:0,sug:0,sod:0},1);
      closeModal(); toast("Added to "+meal); renderView(true); updateStreak(); break;
    }

    /* diary meals */
    case "addFood": foodPickerModal(t.dataset.m); break;
    case "pickFood": {
      const f=S.foods.find(x=>x.id===t.dataset.id);
      if(ui.modal&&ui.modal.recipeMode){ if(f&&ui.recipeDraft){ ui.recipeDraft.items.push({name:f.name,serving:f.serving,unit:f.unit,mult:1,kcal:f.kcal,p:f.p,c:f.c,f:f.f,fib:f.fib||0,sug:f.sug||0,sod:f.sod||0,foodId:f.id}); } closeModal(); recipeBuilderModal(); break; }
      const meal=ui.modal.meal; closeModal(); servingModal(f,meal); break;
    }
    case "pickRecipe": { const rc=S.recipes.find(x=>x.id===t.dataset.id); const meal=ui.modal.meal; closeModal(); if(rc) servingModal(recipeAsFood(rc), meal); break; }
    case "backToRecipe": { closeModal(); recipeBuilderModal(); break; }
    case "confirmServing": { const m=+$("#sv_mult").value||1; const meal=ui.modal.meal; addEntryToMeal(meal,ui.modal.food,m); closeModal(); toast("Added to "+meal); renderView(true); updateStreak(); break; }
    case "newFoodInline": { const meal=ui.modal.meal; closeModal(); foodFormModal(null,{addTo:meal}); break; }
    case "scan": { const meal=t.dataset.m||null; openScanner(meal); break; }
    case "scanManual": { const meal=ui.modal&&ui.modal.meal; closeModal(); foodFormModal(null, meal?{addTo:meal}:null); break; }
    case "editEntry": { const d=S.days[ui.date]; const en=(d.meals[t.dataset.m]||[]).find(x=>x.id===t.dataset.id); if(en) editEntryModal(t.dataset.m,en); break; }
    case "confirmEdit": { const d=S.days[ui.date]; const en=(d.meals[ui.modal.meal]||[]).find(x=>x.id===ui.modal.id); if(en){ en.mult=+$("#ee_mult").value||1; save(); } closeModal(); renderView(true); break; }
    case "dupEntry": { const d=S.days[ui.date]; const arr=d.meals[t.dataset.m]||[]; const en=arr.find(x=>x.id===t.dataset.id); if(en){ arr.push(Object.assign({},en,{id:uid()})); save(); renderView(true); } break; }
    case "delEntry": {
      const d=S.days[ui.date]; const arr=d.meals[t.dataset.m]||[]; const idx=arr.findIndex(x=>x.id===t.dataset.id);
      if(idx>-1){ const removed=arr[idx]; arr.splice(idx,1); save(); renderView(true); updateStreak();
        undoBuf={date:ui.date,meal:t.dataset.m,entry:removed,idx};
        toastUndo("Removed "+removed.name); }
      break;
    }
    case "addMeal": addMealModal(); break;
    case "mealMove": {
      const d=ensureDay(ui.date); const i=d.order.indexOf(t.dataset.m); const j=i+ (+t.dataset.dir);
      if(i>-1&&j>=0&&j<d.order.length){ const o=d.order; [o[i],o[j]]=[o[j],o[i]]; save(); renderView(true); }
      break;
    }
    case "confirmMeal": { const nm=$("#am_name").value.trim(); if(nm){ const d=ensureDay(ui.date); if(!d.order.includes(nm)){ d.order.push(nm); d.meals[nm]=[]; save(); } } closeModal(); renderView(); break; }
    case "copyYest": {
      const y=addDays(ui.date,-1), dy=S.days[y]; if(!dy||!dayHasLog(y)){ toast("Nothing logged yesterday"); break; }
      const d=ensureDay(ui.date);
      dy.order.forEach(m=>{ if(!d.order.includes(m)){ d.order.push(m); d.meals[m]=[]; } (dy.meals[m]||[]).forEach(en=> d.meals[m].push(Object.assign({},en,{id:uid()}))); });
      save(); toast("Copied yesterday's meals"); renderView(true); updateStreak(); break;
    }

    /* water */
    case "water": { const d=ensureDay(ui.date); const i=+t.dataset.i; const target=(i+1)*S.settings.waterUnit; d.water=(d.water>=target)? i*S.settings.waterUnit : target; save(); renderView(true); break; }
    case "waterAdd": { const d=ensureDay(ui.date); d.water+=250; save(); renderView(true); break; }
    case "waterReset": { const d=ensureDay(ui.date); d.water=0; save(); renderView(true); break; }

    /* exercise & steps */
    case "stepsAdd": { const d=ensureDay(ui.date); d.steps=Math.max(0,(d.steps||0)+(+t.dataset.n)); save(); renderView(true); updateStreak(); break; }
    case "stepsSet": { const d=ensureDay(ui.date); const v=$("#stepsInput"); d.steps=Math.max(0,Math.round(+(v&&v.value)||0)); save(); renderView(true); break; }
    case "stepsReset": { const d=ensureDay(ui.date); d.steps=0; save(); renderView(true); break; }
    case "logWorkout": exercisePickerModal(); break;
    case "customWorkout": closeModal(); workoutModal("Custom",3.5,true); break;
    case "pickExercise": { const name=t.dataset.name, met=+t.dataset.met; closeModal(); workoutModal(name,met,false); break; }
    case "wkInt": { ui.modal.met=+t.dataset.met; document.querySelectorAll('[data-act="wkInt"]').forEach(b=>b.classList.toggle("on",b===t)); const min=+($("#wk_min")?.value)||0; const el=$("#wkPreview"); if(el) el.innerHTML=`Burns about <b class="num" style="color:var(--good)">${r0(workoutKcal(ui.modal.met,min))} kcal</b> in ${min||0} min`; break; }
    case "confirmWorkout": {
      const min=+($("#wk_min")?.value)||0; if(min<=0){ toast("Enter a duration"); break; }
      let name=ui.modal.name; if(ui.modal.custom){ name=($("#wk_name")?.value||"").trim()||"Activity"; }
      const kcal=Math.round(workoutKcal(ui.modal.met,min));
      const d=ensureDay(ui.date); d.exercises.push({id:uid(),name,met:ui.modal.met,minutes:min,kcal});
      save(); closeModal(); toast("Logged "+name+" · "+kcal+" kcal"); renderView(true); break;
    }
    case "delWorkout": { const d=ensureDay(ui.date); d.exercises=(d.exercises||[]).filter(x=>x.id!==t.dataset.id); save(); renderView(true); break; }

    /* foods & recipes */
    case "fmode": ui.foodMode=t.dataset.m; renderView(); break;
    case "undoDel": { if(undoBuf){ const b=undoBuf; undoBuf=null; const d=ensureDay(b.date); if(!d.meals[b.meal]){ d.meals[b.meal]=[]; if(!d.order.includes(b.meal))d.order.push(b.meal); } const arr=d.meals[b.meal]; arr.splice(Math.min(b.idx,arr.length),0,b.entry); save(); if(ui.date===b.date) renderView(true); updateStreak(); hideToast(); } break; }
    case "ffilter": ui.mealFilter=t.dataset.f; renderView(); break;
    case "favFood": { const f=S.foods.find(x=>x.id===t.dataset.id); if(f){ f.fav=!f.fav; save(); const el=$("#foodList"); if(el) el.innerHTML=foodListHTML(); } break; }
    case "newRecipe": { ui.recipeDraft={id:null,name:"",servings:1,items:[]}; recipeBuilderModal(); break; }
    case "editRecipe": { const rc=S.recipes.find(x=>x.id===t.dataset.id); if(rc){ ui.recipeDraft={id:rc.id,name:rc.name,servings:rc.servings||1,items:rc.items.map(it=>Object.assign({},it)),fav:rc.fav}; recipeBuilderModal(); } break; }
    case "favRecipe": { const rc=S.recipes.find(x=>x.id===t.dataset.id); if(rc){ rc.fav=!rc.fav; save(); renderView(true); } break; }
    case "delRecipe": { if(confirm("Delete this saved meal? (logged entries stay.)")){ S.recipes=S.recipes.filter(x=>x.id!==t.dataset.id); save(); renderView(true); } break; }
    case "addRecipeToDay": { const rc=S.recipes.find(x=>x.id===t.dataset.id); if(rc) servingModal(recipeAsFood(rc), ensureDay(ui.date).order[0]||"Snacks"); break; }
    case "rcAddIngredient": { closeModal(); foodPickerModal(null,{recipeMode:true}); break; }
    case "rcDelItem": { if(ui.recipeDraft){ ui.recipeDraft.items.splice(+t.dataset.i,1); closeModal(); recipeBuilderModal(); } break; }
    case "saveRecipe": {
      const dr=ui.recipeDraft; if(!dr) break;
      dr.name=($("#rc_name")?.value||dr.name||"").trim(); dr.servings=+($("#rc_serv")?.value)||dr.servings||1;
      if(!dr.name){ toast("Give the recipe a name"); break; }
      if(!dr.items.length){ toast("Add at least one ingredient"); break; }
      if(dr.id){ const rc=S.recipes.find(x=>x.id===dr.id); if(rc){ rc.name=dr.name; rc.servings=dr.servings; rc.items=dr.items; } }
      else { S.recipes.push({id:uid(),name:dr.name,servings:dr.servings,items:dr.items,fav:false}); }
      ui.recipeDraft=null; save(); closeModal(); toast("Recipe saved"); ui.foodMode="recipes"; renderView(); break;
    }
    case "newFood": foodFormModal(null,null); break;
    case "editFood": { const f=S.foods.find(x=>x.id===t.dataset.id); foodFormModal(f,null); break; }
    case "delFood": { if(confirm("Delete this food from your database? (logged entries stay.)")){ S.foods=S.foods.filter(x=>x.id!==t.dataset.id); save(); renderView(); } break; }
    case "addToDay": { const f=S.foods.find(x=>x.id===t.dataset.id); closeModalIfAny(); servingModal(f,ensureDay(ui.date).order[0]||"Snacks"); break; }
    case "saveFood": {
      const get=id=>$("#"+id).value;
      const num=id=>{ const v=$("#"+id).value; return v===""?0:(+v||0); };
      const name=get("ff_name").trim(); if(!name){ toast("Give the food a name"); break; }
      const obj={name,serving:+get("ff_serving")||1,unit:get("ff_unit").trim()||"serving",
        kcal:num("ff_kcal"),p:num("ff_p"),c:num("ff_c"),f:num("ff_f"),fib:num("ff_fib"),sug:num("ff_sug"),sod:num("ff_sod"),cat:get("ff_cat").trim(),barcode:($("#ff_barcode")?.value||"").trim()};
      const ctx=ui.modal.ctx;
      if(ui.modal.id){ const f=S.foods.find(x=>x.id===ui.modal.id); Object.assign(f,obj); save(); closeModal(); toast("Food updated"); renderView(); }
      else{ const nf=Object.assign({id:uid(),fav:false},obj); S.foods.push(nf); save();
        if(ctx&&ctx.addTo){ closeModal(); servingModal(nf,ctx.addTo); } else { closeModal(); toast("Food created"); renderView(); } }
      break;
    }

    /* progress */
    case "range": ui.progressRange=+t.dataset.n; renderView(); break;

    /* weight */
    case "newWeight": weightModal(); break;
    case "confirmWeight": { const v=+$("#wt_v").value; if(!v){ toast("Enter a weight"); break; }
      S.weights.push({id:uid(),date:$("#wt_date").value||ui.date,kg:wToKg(v),bf:+$("#wt_bf").value||null,note:$("#wt_note").value.trim()});
      save(); closeModal(); toast("Weight logged"); renderView(true); break; }
    case "delWeight": { S.weights=S.weights.filter(x=>x.id!==t.dataset.id); save(); renderView(); break; }

    /* settings */
    case "saveGoals": {
      const n=id=>+$("#"+id).value||0;
      Object.assign(S.goals,{kcal:n("g_kcal"),p:n("g_p"),c:n("g_c"),f:n("g_f"),fib:n("g_fib"),sug:n("g_sug"),sod:n("g_sod"),water:n("g_water"),steps:n("g_steps")||10000});
      save(); toast("Goals saved"); break;
    }
    case "setTheme": S.settings.theme=t.dataset.t; applyTheme(); save(); renderTop(); renderView(true); break;
    case "setAccent": S.settings.accent=t.dataset.a; applyTheme(); save(); renderView(true); break;
    case "setUnits": S.settings.units=t.dataset.u; save(); renderTop(); renderView(true); break;
    case "export": {
      S.meta=S.meta||{}; S.meta.lastBackup=Date.now(); save();
      const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob); const a=document.createElement("a");
      a.href=url; a.download="macronaut-backup-"+todayISO()+".json"; a.click(); URL.revokeObjectURL(url); toast("Backup downloaded"); if(ui.view==="settings")renderView(true); if(ui.view==="dashboard")renderView(true); break;
    }
    case "importBtn": $("#importFile").click(); break;
    case "resetAll": { if(confirm("Erase ALL data and start fresh? Export a backup first if unsure.")){ S=defaultState(); loaded=true; applyTheme(); save(); ui.obStep=0; renderOnboarding(); toast("Reset complete"); } break; }
  }
});
function closeModalIfAny(){ if(ui.modal) closeModal(); }

/* overlay click-to-close (only when clicking backdrop) */
document.addEventListener("mousedown",e=>{
  const ov=e.target.classList&&e.target.classList.contains("overlay");
  if(ov){ closeModal(); }
});

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown",e=>{
  if(S.meta && !S.meta.onboarded) return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(e.key==="Escape"){ if(ui.modal) closeModal(); return; }
  if(typing) return;
  const map={"1":"dashboard","2":"diary","3":"food","4":"progress","5":"profile","6":"settings"};
  if(map[e.key]){ ui.view=map[e.key]; renderShell(); return; }
  if(e.key==="q"||e.key==="Q"){ e.preventDefault(); quickAddModal(); return; }
  if(e.key==="t"||e.key==="T"){ ui.date=todayISO(); renderTop(); renderView(); return; }
  if(e.key==="?"){ shortcutsModal(); return; }
  if((ui.view==="dashboard"||ui.view==="diary")&&!ui.modal){
    if(e.key==="ArrowLeft"){ ui.date=addDays(ui.date,-1); renderTop(); renderView(); }
    if(e.key==="ArrowRight"){ ui.date=addDays(ui.date,1); renderTop(); renderView(); }
  }
});

/* ---------------- boot ---------------- */
(async function boot(){
  const raw=await store.get(KEY);
  if(raw){ try{ const obj=JSON.parse(raw); if(obj&&obj.goals&&obj.foods){ S=Object.assign(defaultState(),obj);
    S.settings=Object.assign(defaultState().settings,obj.settings||{}); S.goals=Object.assign(defaultState().goals,obj.goals||{}); S.profile=Object.assign(defaultState().profile,obj.profile||{}); if(!Array.isArray(S.recipes))S.recipes=[]; S.meta=Object.assign({lastBackup:null,onboarded:true},obj.meta||{}); } }catch(e){} }
  loaded=true;
  applyTheme();
  renderApp();
})();
function renderApp(){ if(S.meta&&S.meta.onboarded){ renderShell(); } else { ui.obStep=0; renderOnboarding(); } }
</script>
</body>
</html>
